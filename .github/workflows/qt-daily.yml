name: 큐티 자동요약
on:
  schedule:
    - cron: "0 22 * * *"   # 매일 UTC 22:00 = 한국 오전 7:00
  workflow_dispatch:        # 수동 실행 버튼
permissions:
  contents: write
jobs:
  qt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U yt-dlp
      - name: 큐티 요약 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python qt_summarize.py
      - name: 저장(commit)
        run: |
          git config user.name "qt-bot"
          git config user.email "qt-bot@users.noreply.github.com"
          git add summaries.json
          git commit -m "큐티 요약 자동 업데이트" || echo "변경 없음"
          git push
