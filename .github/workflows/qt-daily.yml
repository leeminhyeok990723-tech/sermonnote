name: 큐티·설교 자동요약
on:
  schedule:
    - cron: "0 22 * * *"                    # 매일 07:00 KST — 큐티인
    - cron: "0,10,20,30,40,50 12 * * 3"     # 수요 21:00~21:50 KST — 수요예배
    - cron: "0 13 * * 3"                    # 수요 22:00 KST
    - cron: "0,10,20,30,40,50 7 * * 0"      # 주일 16:00~16:50 KST — 주일예배
    - cron: "0 8 * * 0"                     # 주일 17:00 KST
  workflow_dispatch:
    inputs:
      source:
        description: "auto / 큐티인 / 주일예배 / 수요예배 (테스트용)"
        default: "auto"
permissions:
  contents: write
jobs:
  qt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: pip install -U yt-dlp
      - name: 요약 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE: ${{ github.event.inputs.source }}
        run: python qt_summarize.py
      - name: 저장(commit)
        run: |
          git config user.name "qt-bot"
          git config user.email "qt-bot@users.noreply.github.com"
          git add summaries.json
          git commit -m "자동 요약 업데이트" || echo "변경 없음"
          git push
